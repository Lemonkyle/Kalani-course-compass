name: Keep Supabase Alive

on:
  schedule:
    - cron: "17 2,10,18 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/keep-alive.yml
      - scripts/check-supabase.mjs

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read and validate a public course
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLIC_KEY: ${{ vars.SUPABASE_PUBLIC_KEY }}
        run: node scripts/check-supabase.mjs
